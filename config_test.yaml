# Test Configuration for Dummy Dataset
# Snakemake Configuration for MobileNetV2 vs ResNet18 Experiment
# Comparing Regular Training, QAT, and PTQ methods

# Experiment parameters
models:
  - "mobilenetv2"
  - "resnet18"

training_methods:
  - "regular"
  - "qat"

quantization_methods:
  - "none"  
  - "ptq"  

# Cross-validation parameters
cross_validation:
  k_folds: 3  
  max_epochs: 1 
  num_trials: 1
  max_concurrent_trials: 1 

# Hyperparameter search space
hyperparameters:
  learning_rate: [0.0001] 
  learning_rate_decay_steps: [200]
  learning_rate_decay: [0.97] 
  momentum: [0.9] 
  batch_size: [16]
  epochs: [5] 
  activation_function: ["ReLU"]
  dropout_rate: [0.2] 
  optimizer: ["adam"]

# Training parameters 
training:
  patience: 3 
  min_delta: 0.001
  max_epochs: 1 

# Data paths (pointing to dummy dataset)
data:
  dataset_folder: "/home/lbutler2/ELP-CNN-Spectrogram/data/spectrogram_cherrypicked"
  train_file: "train.tfrecord"
  validate_file: "validate.tfrecord"
  test_file: "toughset_test.tfrecord"

# Output paths
output:
  results_dir: "/home/lbutler2/ELP-CNN-Spectrogram/results"
  models_dir: "/home/lbutler2/ELP-CNN-Spectrogram/models"
  logs_dir: "/home/lbutler2/ELP-CNN-Spectrogram/logs"
  cross_validation_dir: "/home/lbutler2/ELP-CNN-Spectrogram/cross_validation_results/mobilenetv2_cv_results"

# Quantization parameters
quantization:
  # QAT parameters
  qat_epochs: 3  
  qat_learning_rate: 0.0001
  
  # PTQ parameters
  ptq_calibration_samples: 20 
  ptq_representative_dataset_size: 50 

# Hardware configuration
hardware:
  gpu_memory_growth: true
  mixed_precision: false
