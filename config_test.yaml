# Test Configuration for Dummy Dataset
# Snakemake Configuration for MobileNetV2 vs ResNet18 Experiment
# Comparing Regular Training, QAT, and PTQ methods

# Experiment parameters
models:
  - "mobilenetv2"
  - "resnet18"

training_methods:
  - "regular"
  - "qat"

quantization_methods:
  - "none"  # for regular training
  - "ptq"   # for post-training quantization

# Cross-validation parameters (reduced for testing)
cross_validation:
  k_folds: 3  # Reduced from 5 for faster testing
  max_epochs: 5  # Reduced from 15 for faster testing
  num_trials: 5  # Reduced from 30 for faster testing
  max_concurrent_trials: 1  # Reduced for testing

# Hyperparameter search space (reduced for testing)
hyperparameters:
  learning_rate: [0.001, 0.0001]  # Reduced options
  learning_rate_decay_steps: [200]  # Single option
  learning_rate_decay: [0.97]  # Single option
  momentum: [0.9]  # Single option
  batch_size: [2, 4]  # Large spectrograms (563x98) - batch_size=8 causes OOM
  epochs: [5]  # Reduced for testing
  activation_function: ["ReLU"]  # Single option
  dropout_rate: [0.2]  # Single option
  optimizer: ["adam"]  # Single option

# Training parameters (reduced for testing)
training:
  patience: 3  # Reduced for testing
  min_delta: 0.001
  max_epochs: 10  # Reduced for testing

# Data paths (pointing to dummy dataset)
data:
  dataset_folder: "data/spectrogram_cherrypicked"
  train_file: "train.tfrecord"
  validate_file: "validate.tfrecord"
  test_file: "toughset_test.tfrecord"

# Output paths
output:
  results_dir: "results"
  models_dir: "models"
  logs_dir: "logs"
  cross_validation_dir: "cross_validation_results"

# Quantization parameters (reduced for testing)
quantization:
  # QAT parameters
  qat_epochs: 3  # Reduced for testing
  qat_learning_rate: 0.0001
  
  # PTQ parameters
  ptq_calibration_samples: 20  # Reduced for testing
  ptq_representative_dataset_size: 50  # Reduced for testing

# Hardware configuration
hardware:
  gpu_memory_growth: true
  mixed_precision: false
